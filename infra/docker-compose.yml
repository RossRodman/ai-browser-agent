services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aba
      POSTGRES_PASSWORD: aba
      POSTGRES_DB: aba
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aba
      MINIO_ROOT_PASSWORD: aba-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
